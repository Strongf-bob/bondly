<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Bondly — follow-ups that start as ordinary messages</title>
  <desc id="desc">A Telegram message becomes a person, promise, due date, and reminder in a connected memory thread.</desc>
  <rect width="1200" height="380" rx="28" fill="#1B1534"/>
  <circle cx="1084" cy="70" r="132" fill="#7C3AED" opacity=".18"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="58" y="66" fill="#C4B5FD" font-size="18" font-weight="700" letter-spacing="3">TELEGRAM FOLLOW-UP ASSISTANT</text>
    <text x="58" y="154" fill="#FFF9F5" font-size="76" font-weight="760">Bondly</text>
    <text x="58" y="203" fill="#E9D5FF" font-size="27">Remember people. Keep promises. Follow up on time.</text>
    <g transform="translate(58 248)" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="214" height="54" rx="27" fill="#FFF9F5"/>
      <text x="26" y="34" fill="#1B1534">ordinary message</text>
      <path d="M214 27H274" stroke="#EC4899" stroke-width="3"/>
      <circle cx="286" cy="27" r="12" fill="#EC4899"/>
      <text x="318" y="34" fill="#FFF9F5">structured memory</text>
    </g>
    <g transform="translate(760 64)">
      <path d="M76 44C176 44 120 120 220 120S262 202 362 202" fill="none" stroke="#C4B5FD" stroke-width="4"/>
      <g font-size="19" font-weight="650">
        <rect x="0" y="10" width="148" height="68" rx="20" fill="#FFF9F5"/>
        <text x="25" y="51" fill="#1B1534">Саша</text>
        <rect x="136" y="88" width="176" height="68" rx="20" fill="#7C3AED"/>
        <text x="161" y="129" fill="#FFFFFF">обещание</text>
        <rect x="282" y="170" width="180" height="68" rx="20" fill="#EC4899"/>
        <text x="307" y="211" fill="#FFFFFF">напомнить</text>
      </g>
      <text x="0" y="284" fill="#A78BFA" font-size="18" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PEOPLE · PROMISES · DATES</text>
    </g>
  </g>
</svg>
